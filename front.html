<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Front Desk</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.btn-item { width: 100%; height: 70px; font-size: 1.05rem; margin-bottom:8px; }
.order-panel { max-height: 320px; overflow:auto; }
</style>
</head>
<body class="p-3">
<h3>Front Desk</h3>
<div class="row" id="menu"></div>
<hr>
<div>
  <h5>Current Order</h5>
  <div id="current-items"></div>
  <button id="placeOrder" class="btn btn-success mt-2">Place Order</button>
</div>
<hr>
<h5>Ready for Pickup</h5>
<div id="ready-orders" class="order-panel"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const MENU = [
  "Butter Chicken Rice",
  "Chole Rice",
  "Vada Pav",
  "Samosa Pav",
  "Bhel",
  "Lassi",
  "Kokam Sherbet",
  "Samosa Chat"
];
const socket = io();
let currentOrder = [];

function renderMenu(){
  const menu = document.getElementById('menu');
  menu.innerHTML = '';
  MENU.forEach(name=>{
    const col = document.createElement('div'); col.className='col-6';
    const btn = document.createElement('button'); btn.className='btn btn-primary btn-item';
    btn.innerText = name;
    btn.onclick = ()=>addToOrder(name);
    col.appendChild(btn); menu.appendChild(col);
  });
}
function addToOrder(name){
  const existing = currentOrder.find(x=>x.name===name);
  if(existing) existing.qty++;
  else currentOrder.push({name, qty:1});
  renderCurrent();
}
function renderCurrent(){
  document.getElementById('current-items').innerHTML = currentOrder.map(i=>`${i.name} x ${i.qty}`).join('<br>') || '<em>empty</em>';
}
document.getElementById('placeOrder').onclick = ()=>{
  if(currentOrder.length===0) return;
  fetch('/order', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({items:currentOrder})})
  .then(()=>{ currentOrder = []; renderCurrent(); });
};

function refresh(){
  fetch('/state').then(r=>r.json()).then(data=>{
    const ready = [];
    data.orders.forEach(o=>{
      o.items.forEach(it=>{
        if(it.status === 'ready') ready.push({orderNumber: o.orderNumber, item: it});
      });
    });
    const container = document.getElementById('ready-orders');
    container.innerHTML = '';
    const grouped = {};
    ready.forEach(r=>{ grouped[r.orderNumber] = grouped[r.orderNumber] || []; grouped[r.orderNumber].push(r.item); });
    Object.keys(grouped).forEach(ord=>{
      const div = document.createElement('div'); div.className='card p-2 mb-2';
      div.innerHTML = `<strong>${ord}</strong><br>` + grouped[ord].map(i=>`${i.name} x ${i.qty}`).join('<br>');
      const btn = document.createElement('button'); btn.className='btn btn-sm btn-success mt-2'; btn.innerText='Collect';
      btn.onclick = ()=>collectOrder(ord);
      div.appendChild(btn);
      container.appendChild(div);
    });
  });
}
function collectOrder(orderNumber){
  fetch('/state').then(r=>r.json()).then(data=>{
    const items = [];
    data.orders.forEach(o=>{
      if(o.orderNumber === orderNumber){
        o.items.forEach(it => { if(it.status === 'ready') items.push(it.id); });
      }
    });
    items.forEach(id => {
      fetch('/item/update', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({itemId:id, status:'collected'})});
    });
  });
}

socket.on('order:new', refresh);
socket.on('order:update', refresh);
renderMenu();
renderCurrent();
refresh();
</script>
</body>
</html>
