<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kitchen</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{ --gap:12px; --card-width:260px; }
html,body{height:100%;margin:0;}
body{
  background:#eef2f6;
  padding:12px;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
  overflow:hidden;
  box-sizing:border-box;
}

/* header */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}

/* queue area */
#queue{
  display:flex;
  flex-wrap:wrap;
  gap:var(--gap);
  align-items:flex-start;
  height: calc(100vh - 56px);
  overflow:hidden;
  justify-content:center;
}

/* playing-card style */
.card-play{
  width:var(--card-width);
  background:#fff;
  border-radius:12px;
  padding:12px;
  box-shadow:0 10px 30px rgba(15,23,42,0.08);
  border:1px solid rgba(0,0,0,0.04);
  display:flex;
  flex-direction:column;
  transition:transform .18s ease,opacity .25s ease;
}
.card-play:hover{transform:translateY(-6px) scale(1.01);}

/* header inside card */
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.small-muted{font-size:0.85rem;color:#6c757d;}

/* items list */
.card-items{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
.item-card{
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:8px;
  border-radius:8px;
  background:linear-gradient(180deg,#fbfdff,#f7fbff);
  border:1px solid rgba(0,0,0,0.03);
}
.item-card .title{font-weight:700;font-size:1rem;}
.item-card .qty{font-size:0.95rem;color:#495057;}
.btn-row{display:flex;gap:6px;justify-content:space-between;margin-top:6px;}
.btn-row .btn{flex:1; padding:6px 8px; font-size:0.9rem;}

/* fade out animation */
.fade-out{opacity:0;transform:translateY(20px) scale(.98);transition:opacity .35s ease,transform .35s ease;}

@media (max-width:900px){
  :root{ --card-width:92%; }
  #queue{justify-content:center;}
}
</style>
</head>
<body>
  <div class="header" style="display: flex; justify-content: space-between; align-items: center; width: 100%; position: relative;">
    <h3 style="margin: 0; font-weight: 700;">Kitchen</h3>
    
    <div style="position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; white-space: nowrap;">
      <h3 style="margin: 0; font-weight: 700;">Summer Festival 2026</h3>
      <img src="images/MMS_logo.png" alt="Mandal Logo" style="height: 42px; width: auto; object-fit: contain;">
    </div>
    
    <div class="controls">
      <button id="audioToggle" class="btn btn-outline-danger me-2" onclick="toggleAudio()">🔔 Sound: Off</button>
      <button class="btn btn-outline-dark me-2" onclick="openHistory()">History</button>
      <button class="btn btn-outline-secondary" onclick="refresh()">Refresh</button>
    </div>
  </div>

  <div id="queue"></div>

  <!-- History Modal -->
  <div class="modal fade" id="historyModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Order History</h5></div>
        <div class="modal-body" id="historyBody"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Hardened Network State Initialization for Mobile Devices
let socket = null;
try {
  if (typeof io !== 'undefined') {
    socket = io(window.location.origin, { 
      query: { role: 'kitchen' },
      transports: ['polling', 'websocket']
    });
  } else {
    console.warn("⚠️ Socket.io framework missing on device network adapter. Running in polling backup.");
  }
} catch (networkError) {
  console.error("Network initialization halted:", networkError);
}

/* Audio System State Variables */
let audioEnabled = false;
let audioCtx = null;

// NEW: Determine which station this tablet is assigned to via the URL (e.g., ?station=A)
const urlParams = new URLSearchParams(window.location.search);
const currentStation = urlParams.get('station') || 'ALL'; 

// NEW: Update the top title to clearly show the cooks which tablet this is
document.addEventListener("DOMContentLoaded", () => {
  const titleEl = document.querySelector('.header h3:first-child');
  if (titleEl) {
    if (currentStation === 'A') titleEl.innerText = "Kitchen - Station A";
    if (currentStation === 'B') titleEl.innerText = "Kitchen - Station B";
  }
});

// NEW: Station Routing Logic & Kulfi Update
const STATION_A_ITEMS = ['Bhel', 'Butter Chicken Rice'];
const STATION_B_ITEMS = ['Chole Rice', 'Vada Pav', 'Samosa Pav', 'Samosa Chat'];
const FRONT_DESK_ITEMS = ['Lassi', 'Kokam Sherbet', 'Kulfi'];

function computeCardWidth(){
  const headerHeight = document.querySelector('.header').getBoundingClientRect().height + 12;
  const availW = window.innerWidth - 24;
  
  let cols = 3;
  if(availW < 700) cols = 1;
  else if(availW < 1100) cols = 2;
  else cols = 3;
  
  const gap = 12;
  const width = Math.floor((availW - (cols-1)*gap) / cols);
  const cardWidth = Math.max(220, Math.min(320, width));
  document.documentElement.style.setProperty('--card-width', cardWidth + 'px');
}
window.addEventListener('resize', computeCardWidth);

function renderQueue(orders){
  const container = document.getElementById('queue');
  container.innerHTML = '';
  
  orders.slice().reverse().forEach(o=>{
    // Filter out Front Desk items (Lassi, Kokam Sherbet, and Kulfi)
    let kitchenItems = o.items.filter(it => !FRONT_DESK_ITEMS.includes(it.name));
    
    // Filter strictly by assigned Station
    if (currentStation === 'A') {
      kitchenItems = kitchenItems.filter(it => STATION_A_ITEMS.includes(it.name));
    } else if (currentStation === 'B') {
      kitchenItems = kitchenItems.filter(it => STATION_B_ITEMS.includes(it.name));
    }

    if (kitchenItems.length === 0) return;

    // Check if ALL items assigned to THIS station are ready
    const isStationReady = kitchenItems.every(i => i.status === 'ready' || i.status === 'collected');

    const card = document.createElement('div'); card.className='card-play';
    card.id = `order-${o.orderNumber}`;
    card.innerHTML = `<div class="card-header"><div><strong>${o.orderNumber}</strong><div class="small-muted">${new Date(o.createdAt).toLocaleTimeString()}</div></div><div><span class="badge bg-${isStationReady?'warning':'info'}">${isStationReady?'ready':'placed'}</span></div></div>`;
    const itemsWrap = document.createElement('div'); itemsWrap.className='card-items';
    
    kitchenItems.forEach(it=>{
      const item = document.createElement('div'); item.className='item-card';
      const title = document.createElement('div'); title.className='title'; title.innerText = it.name;
      const qty = document.createElement('div'); qty.className='qty'; qty.innerText = `Quantity: ${it.qty}`;
      const btnRow = document.createElement('div'); btnRow.className='btn-row';
      
      const start = document.createElement('button'); start.className='btn btn-sm btn-outline-warning'; start.innerText='Start';
      start.onclick = ()=> update(it.id,'in_progress');
      const complete = document.createElement('button'); complete.className='btn btn-sm btn-success'; complete.innerText='Complete';
      complete.onclick = ()=> update(it.id,'ready');
      const collect = document.createElement('button'); collect.className='btn btn-sm btn-outline-secondary'; collect.innerText='Mark Collected';
      collect.onclick = ()=> update(it.id,'collected');
      
      if(it.status === 'placed'){ btnRow.appendChild(start); btnRow.appendChild(complete); btnRow.appendChild(collect); }
      else if(it.status === 'in_progress'){ btnRow.appendChild(complete); btnRow.appendChild(collect); }
      else if(it.status === 'ready'){ btnRow.appendChild(collect); }
      else { const badge = document.createElement('span'); badge.className='badge bg-secondary'; badge.innerText = it.status; btnRow.appendChild(badge); }
      item.appendChild(title); item.appendChild(qty); item.appendChild(btnRow);
      itemsWrap.appendChild(item);
    });
    card.appendChild(itemsWrap);
    container.appendChild(card);
  });
}

function update(itemId, status){
  fetch('/item/update', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({itemId, status})})
  .then(()=> {
    setTimeout(()=> {
      fetch('/state').then(r=>r.json()).then(data=>{
        const active = new Set(data.orders.map(o=>o.orderNumber));
        document.querySelectorAll('[id^="order-"]').forEach(el=>{
          const ord = el.id.replace('order-','');
          if(!active.has(ord)){
            el.classList.add('fade-out');
            setTimeout(()=> el.remove(), 400);
          }
        });
        renderQueue(data.orders);
      });
    }, 200);
  });
}

function openHistory(){
  fetch('/history').then(r=>r.json()).then(data=>{
    const body = document.getElementById('historyBody');
    body.innerHTML = '';
    data.orders.slice().reverse().forEach(o=>{
      const card = document.createElement('div');
      card.className = 'card p-2 mb-2';
      card.innerHTML = `<strong>${o.orderNumber}</strong><br>Placed: ${new Date(o.createdAt).toLocaleString()}<br>Completed: ${o.completedAt ? new Date(o.completedAt).toLocaleString() : '—'}<hr>${o.items.map(i => `${i.name} x ${i.qty} (${i.status})`).join('<br>')}`;
      body.appendChild(card);
    });
    new bootstrap.Modal(document.getElementById('historyModal')).show();
  });
}

function refresh(){
  fetch('/state')
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      renderQueue(data.orders);
    })
    .catch(() => console.log("Synchronizing kitchen queue tracks..."));
}

// Bind live events safely if the socket engine initialization cleared
if (socket) {
  socket.on('order:new', (order) => {
    if (audioEnabled && order && order.items) {
      // Filter out Front Desk items
      let relevantItems = order.items.filter(it => !FRONT_DESK_ITEMS.includes(it.name));
      
      // Filter by Station for Chime
      if (currentStation === 'A') relevantItems = relevantItems.filter(it => STATION_A_ITEMS.includes(it.name));
      if (currentStation === 'B') relevantItems = relevantItems.filter(it => STATION_B_ITEMS.includes(it.name));
      
      // Only chime if THIS specific station received an item
      if (relevantItems.length > 0) {
        playKitchenChime();
      }
    }
    refresh();
  });
  socket.on('order:update', refresh);
}

function toggleAudio() {
  const btn = document.getElementById('audioToggle');
  
  if (!audioEnabled) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      audioCtx = new AudioContext();
      audioCtx.resume();
    }
    
    audioEnabled = true;
    btn.className = 'btn btn-success me-2';
    btn.innerText = '🔊 Sound: On';
    
    playKitchenChime();
  } else {
    audioEnabled = false;
    btn.className = 'btn btn-outline-danger me-2';
    btn.innerText = '🔔 Sound: Off';
  }
}

/* Restructured Chime Engine: Uses explicit hardware timeline clock offsets to bypass phone restrictions */
function playKitchenChime() {
  if (!audioCtx) return;
  
  audioCtx.resume().then(() => {
    const now = audioCtx.currentTime;
    
    // Tone 1: High crisp ding (A5 note)
    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(880, now); 
    gain1.gain.setValueAtTime(0.25, now);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    
    osc1.connect(gain1);
    gain1.connect(audioCtx.destination);
    osc1.start(now);
    osc1.stop(now + 0.4);
    
    // Tone 2: Rich harmony accent scheduled exactly 100ms later on the hardware clock
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(1046.5, now + 0.1); 
    gain2.gain.setValueAtTime(0.2, now + 0.1);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    
    osc2.connect(gain2);
    gain2.connect(audioCtx.destination);
    osc2.start(now + 0.1);
    osc2.stop(now + 0.4);
    
  }).catch(e => console.error("Audio interface hardware blocked:", e));
}

function init(){
  computeCardWidth();
  refresh();
  // Safe high-frequency polling container loop executes perfectly on all handheld configurations
  setInterval(refresh, 500);
}
init();
</script>
</body>
</html>
