<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kitchen</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{ --gap:12px; --card-width:260px; }
html,body{height:100%;margin:0;}
body{
  background:#eef2f6;
  padding:12px;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
  overflow:hidden; /* no page scrolling */
  box-sizing:border-box;
}

/* header */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}

/* queue area: wrap cards, but we will compute card width to fit screen without scrolling */
#queue{
  display:flex;
  flex-wrap:wrap;
  gap:var(--gap);
  align-items:flex-start;
  height: calc(100vh - 56px); /* header approx */
  overflow:hidden;
  justify-content:center;
}

/* playing-card style */
.card-play{
  width:var(--card-width);
  background:#fff;
  border-radius:12px;
  padding:12px;
  box-shadow:0 10px 30px rgba(15,23,42,0.08);
  border:1px solid rgba(0,0,0,0.04);
  display:flex;
  flex-direction:column;
  transition:transform .18s ease,opacity .25s ease;
}
.card-play:hover{transform:translateY(-6px) scale(1.01);}

/* header inside card */
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.small-muted{font-size:0.85rem;color:#6c757d;}

/* items list: each item is a small card with name, qty, and buttons row */
.card-items{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
.item-card{
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:8px;
  border-radius:8px;
  background:linear-gradient(180deg,#fbfdff,#f7fbff);
  border:1px solid rgba(0,0,0,0.03);
}
.item-card .title{font-weight:700;font-size:1rem;}
.item-card .qty{font-size:0.95rem;color:#495057;}
.btn-row{display:flex;gap:6px;justify-content:space-between;margin-top:6px;}
.btn-row .btn{flex:1; padding:6px 8px; font-size:0.9rem;}

/* fade out animation for completed orders */
.fade-out{opacity:0;transform:translateY(20px) scale(.98);transition:opacity .35s ease,transform .35s ease;}

/* responsive: reduce card width on small screens */
@media (max-width:900px){
  :root{ --card-width:92%; }
  #queue{justify-content:center;}
}
</style>
</head>
<body>
  <div class="header" style="display: flex; justify-content: space-between; align-items: center; width: 100%; position: relative;">
    <!-- Left: Bold Role Identifier -->
    <h3 style="margin: 0; font-weight: 700;">Kitchen</h3>
    
    <!-- Center: Event Title followed immediately by the Logo -->
    <div style="position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; white-space: nowrap;">
      <h3 style="margin: 0; font-weight: 700;">Summer Festival 2026</h3>
      <img src="images/MMS_logo.png" alt="Mandal Logo" style="height: 42px; width: auto; object-fit: contain;">
    </div>
    
    <!-- Right side controls: Sound button is safely placed here inside the view boundary -->
    <div class="controls">
      <button id="audioToggle" class="btn btn-outline-danger me-2" onclick="toggleAudio()">🔔 Sound: Off</button>
      <button class="btn btn-outline-dark me-2" onclick="openHistory()">History</button>
      <button class="btn btn-outline-secondary" onclick="refresh()">Refresh</button>
    </div>
  </div>

  <!-- The queue takes up the screen space safely now without stumping over stray trailing rows -->
  <div id="queue"></div>

  <!-- History Modal -->
  <div class="modal fade" id="historyModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Order History</h5></div>
        <div class="modal-body" id="historyBody"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Forces long-polling transport fallback if the hotspot firewall blocks native WebSockets
const socket = io(window.location.origin, { 
  query: { role: 'kitchen' },
  transports: ['polling', 'websocket']
});

/* Audio System State Variables */
let audioEnabled = false;
let audioCtx = null;

/* compute card width so cards fit inside the available area without causing page scroll */
function computeCardWidth(){
  const headerHeight = document.querySelector('.header').getBoundingClientRect().height + 12;
  const availW = window.innerWidth - 24;
  
  let cols = 3;
  if(availW < 700) cols = 1;
  else if(availW < 1100) cols = 2;
  else cols = 3;
  
  const gap = 12;
  const width = Math.floor((availW - (cols-1)*gap) / cols);
  const cardWidth = Math.max(220, Math.min(320, width));
  document.documentElement.style.setProperty('--card-width', cardWidth + 'px');
}
window.addEventListener('resize', computeCardWidth);

/* render queue */
function renderQueue(orders){
  const container = document.getElementById('queue');
  container.innerHTML = '';
  
  orders.slice().reverse().forEach(o=>{
    const kitchenItems = o.items.filter(it => it.name !== 'Lassi' && it.name !== 'Kokam Sherbet');
    if (kitchenItems.length === 0) return;

    const card = document.createElement('div'); card.className='card-play';
    card.id = `order-${o.orderNumber}`;
    card.innerHTML = `<div class="card-header"><div><strong>${o.orderNumber}</strong><div class="small-muted">${new Date(o.createdAt).toLocaleTimeString()}</div></div><div><span class="badge bg-${o.status==='ready'?'warning':'info'}">${o.status}</span></div></div>`;
    const itemsWrap = document.createElement('div'); itemsWrap.className='card-items';
    
    kitchenItems.forEach(it=>{
      const item = document.createElement('div'); item.className='item-card';
      const title = document.createElement('div'); title.className='title'; title.innerText = it.name;
      const qty = document.createElement('div'); qty.className='qty'; qty.innerText = `Quantity: ${it.qty}`;
      const btnRow = document.createElement('div'); btnRow.className='btn-row';
      
      const start = document.createElement('button'); start.className='btn btn-sm btn-outline-warning'; start.innerText='Start';
      start.onclick = ()=> update(it.id,'in_progress');
      const complete = document.createElement('button'); complete.className='btn btn-sm btn-success'; complete.innerText='Complete';
      complete.onclick = ()=> update(it.id,'ready');
      const collect = document.createElement('button'); collect.className='btn btn-sm btn-outline-secondary'; collect.innerText='Mark Collected';
      collect.onclick = ()=> update(it.id,'collected');
      
      if(it.status === 'placed'){ btnRow.appendChild(start); btnRow.appendChild(complete); btnRow.appendChild(collect); }
      else if(it.status === 'in_progress'){ btnRow.appendChild(complete); btnRow.appendChild(collect); }
      else if(it.status === 'ready'){ btnRow.appendChild(collect); }
      else { const badge = document.createElement('span'); badge.className='badge bg-secondary'; badge.innerText = it.status; btnRow.appendChild(badge); }
      item.appendChild(title); item.appendChild(qty); item.appendChild(btnRow);
      itemsWrap.appendChild(item);
    });
    card.appendChild(itemsWrap);
    container.appendChild(card);
  });
}

/* update item status */
function update(itemId, status){
  fetch('/item/update', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({itemId, status})})
  .then(()=> {
    setTimeout(()=> {
      fetch('/state').then(r=>r.json()).then(data=>{
        const active = new Set(data.orders.map(o=>o.orderNumber));
        document.querySelectorAll('[id^="order-"]').forEach(el=>{
          const ord = el.id.replace('order-','');
          if(!active.has(ord)){
            el.classList.add('fade-out');
            setTimeout(()=> el.remove(), 400);
          }
        });
        renderQueue(data.orders);
      });
    }, 200);
  });
}

/* history modal */
function openHistory(){
  fetch('/history').then(r=>r.json()).then(data=>{
    const body = document.getElementById('historyBody');
    body.innerHTML = '';
    data.orders.slice().reverse().forEach(o=>{
      const card = document.createElement('div');
      card.className = 'card p-2 mb-2';
      card.innerHTML = `<strong>${o.orderNumber}</strong><br>Placed: ${new Date(o.createdAt).toLocaleString()}<br>Completed: ${o.completedAt ? new Date(o.completedAt).toLocaleString() : '—'}<hr>${o.items.map(i => `${i.name} x ${i.qty} (${i.status})`).join('<br>')}`;
      body.appendChild(card);
    });
    new bootstrap.Modal(document.getElementById('historyModal')).show();
  });
}

/* refresh and socket */
function refresh(){
  fetch('/state').then(r=>r.json()).then(data=>{
    renderQueue(data.orders);
  });
}

socket.on('order:new', (order) => {
  if (audioEnabled && order && order.items) {
    // Check if the order contains at least one item that is NOT a front-counter drink
    const hasFoodItems = order.items.some(it => it.name !== 'Lassi' && it.name !== 'Kokam Sherbet');
    
    if (hasFoodItems) {
      playKitchenChime();
    }
  }
  refresh();
});
socket.on('order:update', refresh);

/* Toggles kitchen notification sound capabilities */
function toggleAudio() {
  const btn = document.getElementById('audioToggle');
  
  if (!audioEnabled) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      audioCtx = new AudioContext();
      // CRITICAL FOR MOBILE PHONES: Wake up the audio hardware directly inside the touch gesture
      audioCtx.resume();
    }
    
    audioEnabled = true;
    btn.className = 'btn btn-success me-2';
    btn.innerText = '🔊 Sound: On';
    
    playKitchenChime();
  } else {
    audioEnabled = false;
    btn.className = 'btn btn-outline-danger me-2';
    btn.innerText = '🔔 Sound: Off';
  }
}

/* Synthesizes a clean, dual-tone electronic restaurant bell chime */
function playKitchenChime() {
  if (!audioCtx) return;
  
  try {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    
    // Tone 1: High crisp ding (A5 note)
    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(880, audioCtx.currentTime); 
    gain1.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    
    osc1.connect(gain1);
    gain1.connect(audioCtx.destination);
    osc1.start();
    osc1.stop(audioCtx.currentTime + 0.4);
    
    // Tone 2: Rich harmony accent delayed by 100ms (C6 note)
    setTimeout(() => {
      if (!audioCtx) return;
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1046.5, audioCtx.currentTime); 
      gain2.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start();
      osc2.stop(audioCtx.currentTime + 0.3);
    }, 100);
    
  } catch (e) {
    console.error("Audio playback interrupted:", e);
  }
}

/* init */
function init(){
  computeCardWidth();
  refresh();
  // High-frequency backup loop: keeps kitchen monitor updated every 0.5 seconds
  setInterval(refresh, 500);
}
init();
</script>
</body>
</html>
